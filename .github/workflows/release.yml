name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Run regression baseline
        run: ./Scripts/test.sh

      - name: Build
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || VER="0.0.0-dev"
          VERSION="$VER" BUILD="$GITHUB_RUN_NUMBER" SIGN_IDENTITY=- ./build.sh
          ./Scripts/dmg.sh "Setem-$VER.dmg"
          echo "DMG=Setem-$VER.dmg" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: Setem
          path: ${{ env.DMG }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          [[ -n "$SPARKLE_ED_PRIVATE_KEY" ]] || {
            echo "Missing the SPARKLE_ED_PRIVATE_KEY repository secret; generate it with Sparkle's generate_keys tool." >&2
            exit 1
          }
          SPARKLE_VERSION=2.9.6
          SPARKLE_DIR="$RUNNER_TEMP/sparkle"
          mkdir -p "$SPARKLE_DIR"
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-for-Swift-Package-Manager.zip" \
            -o "$RUNNER_TEMP/sparkle.zip"
          unzip -q "$RUNNER_TEMP/sparkle.zip" -d "$SPARKLE_DIR"
          APPCAST_DIR="$RUNNER_TEMP/appcast"
          mkdir -p "$APPCAST_DIR"
          cp "$DMG" "$APPCAST_DIR/"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | "$SPARKLE_DIR/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            "$APPCAST_DIR"
          gh release create "$GITHUB_REF_NAME" "$APPCAST_DIR/$DMG" "$APPCAST_DIR/appcast.xml" \
            --title "Setem $GITHUB_REF_NAME" --generate-notes \
            --notes "未经 Apple 公证（ad-hoc 签名）。打开 DMG 将 Setem 拖到「应用程序」后，首次运行前在终端执行：\`xattr -dr com.apple.quarantine /Applications/Setem.app\`"
